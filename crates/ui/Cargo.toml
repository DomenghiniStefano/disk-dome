[package]
name = "diskdome-ui"
description = "DiskDome's desktop interface, built with Slint."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "diskdome_ui"
path = "src/lib.rs"

[[bin]]
name = "diskdome"
path = "src/main.rs"

[dependencies]
diskdome-core.workspace = true
diskdome-treemap.workspace = true
slint.workspace = true
# Parallel sort and generation for the table proof (MIT OR Apache-2.0).
rayon = "1.12"

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The design rules test reads the .slint sources (MIT OR Apache-2.0).
regex = "1"
