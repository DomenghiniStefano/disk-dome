[package]
name = "diskdome-ui"
description = "DiskDome's desktop interface, built with Slint."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "diskdome_ui"
path = "src/lib.rs"

[[bin]]
name = "diskdome"
path = "src/main.rs"

[dependencies]
diskdome-core.workspace = true
# The design system (Dome UI): its Slint half is imported as `@dome-ui` (`build.rs`).
dome-ui.workspace = true
diskdome-treemap.workspace = true
slint = { workspace = true, features = ["raw-window-handle-06"] }
diskdome-platform.workspace = true
# The title bar spike only, until the app's own title bar lands.
raw-window-handle = { workspace = true, optional = true }
# The Kit's search with regular expressions (MIT OR Apache-2.0); the app's own search will use it too.
regex = { version = "1", optional = true }
# Parallel sort and generation for the table proof (MIT OR Apache-2.0).
rayon = { version = "1.12", optional = true }

[build-dependencies]
slint-build.workspace = true

[features]
# The Kit window of the design system (`docs/design-system.md` § 9): development only, never in a release.
kit = ["dep:regex"]
# The throwaway proofs, development only, never in a release: step 3's table over millions of rows (card 3c,
# `--proof-rows`) and the title bar spike (card 4.T1, `--spike-titlebar`).
spikes = ["dep:rayon", "dep:raw-window-handle"]

[[example]]
name = "proof_bench"
required-features = ["spikes"]

[lints]
workspace = true

[dev-dependencies]
# The design rules test reads the .slint sources (MIT OR Apache-2.0).
regex = "1"
